# Netlify builds the Next.js app (the Next.js runtime adapter is applied automatically).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Public base URL used for auth email redirects, invitation links and metadata.
[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://eventzo-reddy.netlify.app"