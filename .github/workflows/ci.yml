# Eventzo CI. Never touches a hosted Supabase project: the full job runs its
# own throw-away Supabase stack in Docker on the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, migrations (PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:check

  full:
    name: pgTAP, build, end-to-end (local Supabase)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start Supabase (Docker) with migrations and the dev seed
        run: npx supabase start
      - name: pgTAP (RLS & database logic)
        run: npx supabase test db
      - name: Point the app at the local stack
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' > .env.local
          {
            echo 'NEXT_PUBLIC_SITE_URL="http://localhost:3200"'
            echo 'PAYMENTS_SIMULATOR=true'
            echo 'NOTIFICATIONS_SIMULATOR=true'
          } >> .env.local
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build)
        run: |
          npx next start -p 3200 &
          for i in $(seq 1 60); do curl -fs http://localhost:3200/api/health && break; sleep 2; done
          PLAYWRIGHT_BASE_URL=http://localhost:3200 PW_WORKERS=2 npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
